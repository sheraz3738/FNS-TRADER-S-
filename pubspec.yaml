version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  firebase_storage: ^13.0.0
  printing: ^5.14.2
