
name: Build FNS TRADERS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create fresh Android project
        run: |
          flutter create --platforms=android --org com.fnstraders temp_project
          rm -rf android
          cp -r temp_project/android android
          rm -rf temp_project

      - name: Update Kotlin version
        shell: bash
        run: |
          SETTINGS=""
          if [ -f android/settings.gradle.kts ]; then
            SETTINGS="android/settings.gradle.kts"
          elif [ -f android/settings.gradle ]; then
            SETTINGS="android/settings.gradle"
          else
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          sed -i \
            -e 's/2\.1\.0/2.3.0/g' \
            -e 's/2\.2\.0/2.3.0/g' \
            -e 's/2\.2\.20/2.3.0/g' \
            "$SETTINGS"

          echo "Using settings file: $SETTINGS"
          cat "$SETTINGS"

      - name: Enable AndroidX
        run: |
          grep -q '^android.useAndroidX=' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -q '^android.enableJetifier=' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="FNS TRADERS"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Check Flutter project
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release --target lib/main_customer.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
