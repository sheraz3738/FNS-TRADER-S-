name: Build FNS Apps
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter pub get
      - name: Build Admin APK
        run: |
          sed -i 's/applicationId ".*"/applicationId "com.fns.traders.admin"/' android/app/build.gradle
          flutter build apk --release -t lib/main.dart
          mv build/app/outputs/flutter-apk/app-release.apk FNS-Admin.apk
      - name: Build Customer APK
        run: |
          flutter clean
          flutter pub get
          sed -i 's/applicationId ".*"/applicationId "com.fns.traders.customer"/' android/app/build.gradle
          flutter build apk --release -t lib/main_customer.dart
          mv build/app/outputs/flutter-apk/app-release.apk FNS-Customer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FNS-Final-APKs
          path: |
            FNS-Admin.apk
            FNS-Customer.apk
