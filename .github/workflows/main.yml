name: Build FNS TRADERS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.fnstraders temp_project
          rm -rf android
          cp -r temp_project/android android
          rm -rf temp_project

      - name: Update Kotlin Gradle plugin
        run: |
          sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.3.0"/' android/settings.gradle.kts
          grep 'org.jetbrains.kotlin.android' android/settings.gradle.kts

      - name: Migrate Kotlin JVM target DSL
        run: |
          sed -i '1i import org.jetbrains.kotlin.gradle.dsl.JvmTarget' android/app/build.gradle.kts
          sed -i 's/kotlinOptions[[:space:]]*{/compilerOptions {/' android/app/build.gradle.kts
          sed -i 's/jvmTarget = JavaVersion.VERSION_11.toString()/jvmTarget.set(JvmTarget.JVM_11)/' android/app/build.gradle.kts
          grep -n -E 'compilerOptions|jvmTarget|kotlinOptions' android/app/build.gradle.kts

      - name: Enable AndroidX
        run: |
          grep -q '^android.useAndroidX=' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -q '^android.enableJetifier=' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="FNS TRADERS"/' android/app/src/main/AndroidManifest.xml

      - name: Check required files
        run: |
          test -f pubspec.yaml
          test -f lib/main_customer.dart
          test -f fns_logo.png

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target lib/main_customer.dart

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view customer-apk --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete customer-apk --repo "$GH_REPO" --yes
          fi
          gh release create customer-apk build/app/outputs/flutter-apk/app-release.apk --repo "$GH_REPO" --title "FNS TRADERS Customer APK" --notes "FNS TRADERS Customer Android App" --latest
