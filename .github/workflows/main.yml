name: Build Both APKs
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get

      - name: Build Customer APK
        run: flutter build apk --split-per-apk -t lib/main_customer.dart --build-name=customer

      - name: Rename Customer APK
        run: mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/customer.apk

      - name: Build Admin APK
        run: flutter build apk --split-per-apk -t lib/main.dart --build-name=admin

      - name: Rename Admin APK
        run: mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FNS-Both-APKs
          path: |
            build/app/outputs/flutter-apk/customer.apk
            build/app/outputs/flutter-apk/admin.apk
