
name: Build FNS TRADERS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create fresh Android project
        run: |
          flutter create --platforms=android --org com.fnstraders temp_project
          rm -rf android
          cp -r temp_project/android android
          rm -rf temp_project

      - name: Update Kotlin plugin version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle")
          ]

          settings = next((p for p in candidates if p.exists()), None)

          if settings is None:
              raise SystemExit("Android Gradle settings file not found")

          s = settings.read_text()
          s = re.sub(
              r'(?m)(id\(["\']org\.jetbrains\.kotlin\.android["\']\)\s+version\s+)["\'][^"\']+["\']',
              r'\g<1>"2.3.0"',
              s
          )
          s = re.sub(
              r'(?m)(id\(["\']org\.jetbrains\.kotlin\.android["\'],\s*version\s*=\s*)["\'][^"\']+["\']',
              r'\g<1>"2.3.0"',
              s
          )
          settings.write_text(s)
          print(settings.read_text())
          PY

      - name: Migrate Kotlin compiler options
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          matches = list(re.finditer(r'(?m)^[ \t]*kotlinOptions[ \t]*\{', s))

          for m in reversed(matches):
              start = m.start()
              brace = s.find("{", m.start())
              depth = 0
              end = None

              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Could not safely remove kotlinOptions block")

              s = s[:start] + s[end:]

          s = re.sub(r'\n{3,}', '\n\n', s)

          compiler = """
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
              }
          }
          """

          s = s.rstrip() + "\n\n" + compiler.strip() + "\n"
          p.write_text(s)

          if "kotlinOptions" in s:
              raise SystemExit("Old kotlinOptions setting still exists")

          print(p.read_text())
          PY

      - name: Enable AndroidX
        run: |
          grep -q '^android.useAndroidX=' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -q '^android.enableJetifier=' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="FNS TRADERS"/' android/app/src/main/AndroidManifest.xml

      - name: Check required files
        run: |
          test -f pubspec.yaml
          test -f lib/main_customer.dart
          grep -n "kotlinOptions\|compilerOptions\|jvmTarget" android/app/build.gradle.kts || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target lib/main_customer.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
