name: FNS TRADERS Final Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Fix Project Name to CAPITAL
        run: |
          mv main.dart main_backup.dart || true
          rm -f pubspec.yaml
          flutter create --project-name fns_traders --org com.fnstraders.app --platforms=android . --overwrite
          mv main_backup.dart lib/main.dart || true
          flutter pub get
          sed -i "s/android:label=\".*\"/android:label=\"FNS TRADER'S\"/g" android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values
          echo '<resources><string name="app_name">FNS TRADER'"'"'S</string></resources>' > android/app/src/main/res/values/strings.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FNS-TRADERS.apk

      - name: Release Direct APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FNS TRADER'S v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/FNS-TRADERS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
