name: Build FNS Apps
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Fix Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name fns_traders
          flutter pub get

      - name: Build Admin APK
        run: |
          flutter build apk --release -t lib/main.dart
          mv build/app/outputs/flutter-apk/app-release.apk FNS-Admin.apk

      - name: Build Customer APK
        run: |
          flutter build apk --release -t lib/main_customer.dart
          mv build/app/outputs/flutter-apk/app-release.apk FNS-Customer.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-Admin-APK
          path: FNS-Admin.apk

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-Customer-APK
          path: FNS-Customer.apk
