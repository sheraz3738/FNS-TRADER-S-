name: Build FNS TRADERS APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - run: flutter pub get

      - name: Build Admin APK
        run: flutter build apk --release --target lib/main.dart

      - name: Build Customer APK
        run: flutter build apk --release --target lib/main_customer.dart --build-name=2.0 --build-number=2

      - name: Upload Admin
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Customer
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
