name: FNS TRADERS Final Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Build APK
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name fns_traders --org com.fnstraders.app --platforms=android . --overwrite
          fi
          cp main.dart lib/main.dart
          flutter pub get
          sed -i "s/android:label=\".*\"/android:label=\"FNS TRADER'S\"/g" android/app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">FNS TRADER'"'"'S</string></resources>' > android/app/src/main/res/values/strings.xml
          flutter build apk --release

      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FNS TRADER'S v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
