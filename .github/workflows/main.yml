name: FNS TRADERS APK Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Create Android Folder
        run: |
          if [! -d "android" ]; then
            flutter create. --platforms=android --org com.fnstraders --project-name fns_traders --no-overwrite
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
