
name: Build FNS TRADERS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create fresh Android project
        run: |
          flutter create --platforms=android --org com.fnstraders temp_project
          rm -rf android
          cp -r temp_project/android android
          rm -rf temp_project

      - name: Update Android Kotlin configuration
        run: |
          sed -i 's/2\.1\.0/2.3.0/g' android/settings.gradle.kts 2>/dev/null || true
          sed -i 's/2\.1\.0/2.3.0/g' android/settings.gradle 2>/dev/null || true
          sed -i 's/2\.2\.0/2.3.0/g' android/settings.gradle.kts 2>/dev/null || true
          sed -i 's/2\.2\.0/2.3.0/g' android/settings.gradle 2>/dev/null || true
          sed -i 's/jvmTarget = JavaVersion.VERSION_11.toString()/jvmTarget = "11"/' android/app/build.gradle.kts
          sed -i 's/jvmTarget = JavaVersion.VERSION_17.toString()/jvmTarget = "17"/' android/app/build.gradle.kts

      - name: Enable AndroidX
        run: |
          grep -q '^android.useAndroidX=' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -q '^android.enableJetifier=' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Set app name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="FNS TRADERS"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target lib/main_customer.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
