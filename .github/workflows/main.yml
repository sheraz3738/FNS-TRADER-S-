name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
      - name: Build Real App
        run: |
          cp lib/main.dart /tmp/main.dart
          rm -rf Android android
          sed -i 's/flutter_blue_plus:.*/flutter_blue_plus: ^1.31.15/' pubspec.yaml
          sed -i '/marquee/d' pubspec.yaml || true
          flutter create . --project-name fns_trader_s_ --platforms=android
          cp /tmp/main.dart lib/main.dart
          flutter clean- uses: actions/checkout@v4
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-REAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
