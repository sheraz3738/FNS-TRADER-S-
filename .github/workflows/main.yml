name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Fix all issues
        run: |
          rm -rf Android android
          sed -i "s/^name:.*/name: fns_trader_s_/" pubspec.yaml
          sed -i "/marquee/d" pubspec.yaml || true
          sed -i "s/flutter_blue_plus:.*/flutter_blue_plus: ^1.35.5/" pubspec.yaml || true
          sed -i "s/flutter_blue_plus_android:.*/flutter_blue_plus_android: ^1.3.12/" pubspec.yaml || true
          flutter create . --project-name fns_trader_s_ --platforms=android
          flutter clean- uses: actions/setup-java@v4
          flutter pub upgrade
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
