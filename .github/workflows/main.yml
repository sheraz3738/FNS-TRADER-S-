name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Fix Name and Build
        run: |
          rm -rf Android android
          sed -i "s/^name:.*/name: fns_trader_s_/" pubspec.yaml
          sed -i "/marquee/d" pubspec.yaml || true
          flutter create . --project-name fns_trader_s_ --platforms=android
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
