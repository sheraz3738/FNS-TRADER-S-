name: Build FNS TRADERS APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix project structure
        run: |
          flutter create . --project-name fns_traders --org com.fns.traders --platforms=android
          mkdir -p lib
          if [ -f "main.dart" ]; then cp main.dart lib/main.dart; fi
          flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
