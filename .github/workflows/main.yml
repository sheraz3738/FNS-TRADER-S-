name: FNS TRADER'S Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Setup Project
        run: |
          flutter create --platforms=android .
          flutter pub get
          sed -i 's/android:label=".*"/android:label="FNS TRADER'\''S"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FNS-TRADERS.apk

      - name: Release Direct APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FNS TRADER'S v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/FNS-TRADERS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
