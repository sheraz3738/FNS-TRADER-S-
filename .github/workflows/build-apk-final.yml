name: Build FNS TRADER'S APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android files
        run: |
          flutter create --platforms=android temp_app
          cp -r temp_app/android .
          rm -rf temp_app

      - name: Set final FNS Android identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              s = manifest.read_text()
              s = s.replace('android:label="${appName}"', 'android:label="FNS TRADER\'S"')
              s = s.replace('android:label="temp_app"', 'android:label="FNS TRADER\'S"')
              s = s.replace('android:label="temp"', 'android:label="FNS TRADER\'S"')
              manifest.write_text(s)

          strings = Path('android/app/src/main/res/values/strings.xml')
          if strings.exists():
              s = strings.read_text().replace('temp_app', 'FNS TRADER\'S').replace('Temp-App', 'FNS TRADER\'S')
              strings.write_text(s)

          for p in [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]:
              if p.exists():
                  t = p.read_text()
                  t = t.replace('com.example.temp_app', 'com.fns.traders')
                  t = t.replace('temp_app', 'fns_traders')
                  p.write_text(t)
          PY

      - name: Put FNS app code in lib
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-FINAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
