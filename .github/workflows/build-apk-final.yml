name: Build FNS TRADERS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Create Android files
        run: |
          flutter create --platforms=android temp_app
          cp -r temp_app/android .
          rm -rf temp_app

      - name: FORCE FNS TRADERS name
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          APP_NAME = "FNS TRADERS"
          m = Path('android/app/src/main/AndroidManifest.xml')
          txt = m.read_text()
          txt = re.sub(r'android:label="[^"]+"', f'android:label="{APP_NAME}"', txt)
          m.write_text(txt)
          print("Manifest fixed:", txt[:500])
          # also fix strings if exists
          s = Path('android/app/src/main/res/values/strings.xml')
          if s.exists():
              s.write_text(f'<resources><string name="appName">{APP_NAME}</string></resources>')
          PY

      - name: Put FNS app code in lib
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-FINAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
