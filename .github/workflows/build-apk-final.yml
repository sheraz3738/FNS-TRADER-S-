name: Build FNS TRADER'S APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android files
        run: |
          flutter create --platforms=android temp_app
          cp -r temp_app/android .
          rm -rf temp_app

      - name: Set app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          old = 'android:label="'
          start = s.find(old)
          if start == -1:
              raise SystemExit('android:label not found')
          end = s.find('"', start + len(old))
          if end == -1:
              raise SystemExit('android:label value not found')
          s = s[:start] + 'android:label="FNS TRADER\'S' + s[end:]
          p.write_text(s)
          PY

      - name: Put FNS app code in lib
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNS-TRADERS-FINAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
