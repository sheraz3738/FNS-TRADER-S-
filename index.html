<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNS TRADER'S - Official App</title>
<style>
body{font-family:Arial;text-align:center;background:#f4f4f4;padding:20px}
.card{background:white;max-width:400px;margin:50px auto;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
img{width:120px;border-radius:20px}
.btn{display:block;background:#000;color:white;padding:16px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:18px;margin-top:20px}
h1{margin:15px 0 5px 0}
</style>
</head>
<body>
<div class="card">
<img src="fns_logo.png">
<h1>FNS TRADER'S</h1>
<p>BA BA FALAK NAZ & SON'S TRADER'S<br>Official Android App</p>
<a id="dl" class="btn" href="#">Download APK</a>
<p style="font-size:12px;color:gray;margin-top:15px">Version: Latest • Auto Updated</p>
</div>
<script>
fetch('https://api.github.com/repos/sheraz3738/FNS-TRADER-S-/releases/latest')
.then(r=>r.json())
.then(d=>{
  let apk = d.assets.find(a=>a.name.endsWith('.apk'));
  if(apk) document.getElementById('dl').href = apk.browser_download_url;
  else document.getElementById('dl').href = d.assets[0].browser_download_url;
})
.catch(()=>{document.getElementById('dl').href='https://github.com/sheraz3738/FNS-TRADER-S-/releases'; document.getElementById('dl').innerText='Go to Releases';});
</script>
</body>
</html>
