 <rect x="1260" y="555" width="145" height="185" rx="18" fill="#e8f8f0" stroke="#1b9a72" stroke-width="7"/><rect x="1290" y="515" width="85" height="48" rx="10" fill="#1b9a72"/><text x="1332" y="650" text-anchor="middle" font-family="Arial" font-size="25" fill="#137451" font-weight="bold">CARE</text>
 <path d="M300 785 h1100 l-55 28 H355z" fill="#b4c6d3"/>
</g>
<!-- shopping bag and cart -->
<g transform="translate(780 765)" filter="url(#shadow)"><path d="M-65 -75 h130 l-12 110 h-106z" fill="url(#green)"/><path d="M-32 -75 q0 -55 32 -55 q32 0 32 55" fill="none" stroke="#16845a" stroke-width="12"/><text x="0" y="-8" text-anchor="middle" font-family="Arial" font-size="24" fill="#fff" font-weight="bold">FNS</text></g>
<rect x="0" y="880" width="1600" height="120" fill="url(#blue)"/>
<text x="800" y="955" text-anchor="middle" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="#fff">YOUR HEALTH &amp; DAILY NEEDS, ALL IN ONE PLACE</text>
