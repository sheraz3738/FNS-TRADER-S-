<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#eaf7ff"/><stop offset="1" stop-color="#c7e7dc"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#0754b8"/><stop offset="1" stop-color="#092b69"/></linearGradient>
 <linearGradient id="green" x2="1" y2="1"><stop stop-color="#5fc98a"/><stop offset="1" stop-color="#16845a"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".18"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="110" fill="#ffffff" opacity=".55"/>
<g opacity=".22" fill="#fff"><circle cx="140" cy="130" r="95"/><circle cx="1450" cy="170" r="125"/><circle cx="1280" cy="720" r="180"/></g>
<text x="800" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="bold" fill="#103b80">FNS TRADERS</text>
<text x="800" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#16845a">MEDICAL &amp; GENERAL STORE</text>
<text x="800" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#35506a">Health essentials • Daily needs • One convenient place</text>
<rect x="90" y="285" width="1420" height="555" rx="36" fill="#fff" opacity=".62" filter="url(#shadow)"/>
<!-- pharmacy cross -->
