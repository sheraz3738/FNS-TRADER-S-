 <rect x="475" y="445" width="155" height="295" rx="12" fill="#fff" stroke="#28a66b" stroke-width="7"/><rect x="475" y="445" width="155" height="65" fill="#28a66b"/><text x="552" y="487" text-anchor="middle" font-family="Arial" font-size="25" fill="#fff" font-weight="bold">VITAMINS</text><circle cx="552" cy="600" r="52" fill="#e9f7d8"/><text x="552" y="612" text-anchor="middle" font-family="Arial" font-size="38" fill="#27824d" font-weight="bold">+</text>
 <rect x="665" y="540" width="125" height="200" rx="16" fill="#f5faff" stroke="#e2a52d" stroke-width="7"/><rect x="690" y="500" width="75" height="48" rx="9" fill="#e2a52d"/><rect x="682" y="615" width="92" height="62" rx="8" fill="#fff0c7"/><text x="728" y="654" text-anchor="middle" font-family="Arial" font-size="20" fill="#8a5a00">SYRUP</text>
</g>
<!-- stethoscope -->
<g fill="none" stroke="#164d89" stroke-width="18" stroke-linecap="round"><path d="M860 475 v105 c0 100 155 100 155 0 V475"/><path d="M860 475 q0 -60 55 -60"/><path d="M1015 475 q0 -60 -55 -60"/></g><circle cx="938" cy="695" r="35" fill="#d5e9f8" stroke="#164d89" stroke-width="16"/>
